name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 12 * * 1"   # every Monday at 12:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    # Every unit test plus the end-to-end test, with the LLM stubbed.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m spacy download en_core_web_lg
      - name: Run all tests (stub LLM)
        env:
          HC_LLM: stub
        run: pytest -v

  live:
    # Weekly and on demand: the end-to-end test with real Gemma served by Ollama.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OLLAMA_VERSION: "0.40.6"
      HC_GEMMA_MODEL: gemma3:1b
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m spacy download en_core_web_lg
      - name: Install Ollama and pull Gemma
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version
          ollama pull "$HC_GEMMA_MODEL"
      - name: Run end-to-end test (live Gemma)
        env:
          HC_LLM: ollama
        run: pytest -v tests/test_end_to_end.py
